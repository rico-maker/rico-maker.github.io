<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rico Maker — Projetos</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #0d0f12;
    color: #f1f3f5;
}

.container {
    width: min(1100px, calc(100% - 32px));
    margin: 0 auto;
    padding: 55px 0;
}

/* HEADER */

h1 {
    margin: 0;

    font-size: 38px;
    font-weight: 750;
    letter-spacing: -1.5px;

    color: #f5f6f7;
}

header p {
    margin: 8px 0 30px;

    color: #858a92;

    font-size: 16px;
}

/* SEARCH */

.search {
    width: 100%;
    height: 48px;

    padding: 0 16px;

    border: 1px solid #292d33;
    border-radius: 12px;

    outline: none;

    background: #15181c;
    color: #f1f3f5;

    font: inherit;
    font-size: 15px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.search::placeholder {
    color: #666c74;
}

.search:focus {
    border-color: #505761;

    background: #181b20;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.04);
}

/* PROJECTS */

#projects {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

    gap: 14px;

    margin-top: 20px;
}

/* PROJECT CARD */

.project {
    min-height: 150px;

    padding: 20px;

    border: 1px solid #292d33;
    border-radius: 15px;

    background: #15181c;
    color: #f1f3f5;

    text-align: left;

    cursor: pointer;

    font: inherit;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.project:hover {
    transform: translateY(-3px);

    border-color: #3a4048;

    background: #191c21;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.project:active {
    transform: translateY(-1px);
}

.project-icon {
    display: flex;

    width: 38px;
    height: 38px;

    margin-bottom: 14px;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: #22262c;

    color: #c8cdd4;

    font-size: 19px;
}

.project-name {
    display: block;

    margin-bottom: 6px;

    color: #f1f3f5;

    font-size: 17px;
    font-weight: 650;
}

.project-description {
    display: block;

    color: #7f858d;

    font-size: 13px;
    line-height: 1.4;
}

/* CRIAR */

.create-project {
    border: 1px dashed #416b94;

    background: #121c27;

    color: #dcecff;
}

.create-project .project-icon {
    background: #1b3045;

    color: #74b4f5;
}

.create-project .project-name {
    color: #dcecff;
}

.create-project .project-description {
    color: #718ba4;
}

.create-project:hover {
    border-color: #5b91c5;

    background: #162333;
}

.create-project:hover .project-icon {
    background: #24415d;
}

/* LOADING */

.loading {
    grid-column: 1 / -1;

    padding: 40px;

    text-align: center;

    color: #666c74;
}

/* MODAL OVERLAY */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.68);

    backdrop-filter: blur(6px);

    z-index: 1000;
}

.modal-overlay.active {
    display: flex;
}

/* MODAL */

.modal {
    width: min(420px, 100%);

    padding: 26px;

    border: 1px solid #2b3037;
    border-radius: 18px;

    background: #15181c;

    color: #f1f3f5;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5);

    animation: modalIn .18s ease;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform: scale(.96) translateY(8px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

}

.modal h2 {
    margin: 0 0 7px;

    color: #f5f6f7;

    font-size: 22px;
}

.modal p {
    margin: 0 0 22px;

    color: #818790;

    font-size: 14px;
}

/* MODAL BUTTONS */

.buttons {
    display: flex;

    flex-direction: column;

    gap: 9px;
}

.buttons button,
.cancel {
    width: 100%;
    height: 44px;

    border: 0;
    border-radius: 10px;

    font: inherit;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.buttons button:hover,
.cancel:hover {
    transform: translateY(-1px);
}

/* ABRIR */

.primary {
    background: #f1f3f5;
    color: #111318;
}

.primary:hover {
    background: #ffffff;
}

/* EDITAR */

.blue {
    background: #172b3e;
    color: #79baff;
}

.blue:hover {
    background: #1d3851;
}

/* ABRIR + EDITAR */

#bothButton {
    background: #22262c;
    color: #d2d6dc;
}

#bothButton:hover {
    background: #292e35;
}

/* CANCELAR */

.cancel {
    margin-top: 10px;

    background: transparent;

    color: #777e87;
}

.cancel:hover {
    background: #20242a;

    color: #aeb4bc;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        width: min(100% - 22px, 1100px);

        padding: 35px 0;
    }

    h1 {
        font-size: 31px;
    }

    #projects {
        grid-template-columns: 1fr;
    }

}
</style>
</head>


<body>

<div class="container">

    <header>

        <h1>Rico Maker</h1>

        <p>
            Projetos e experimentos
        </p>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Pesquisar projeto..."
            autocomplete="off"
        >

    </header>


    <section id="projects">

        <div class="loading">
            Carregando projetos...
        </div>

    </section>

</div>


<!-- MODAL -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
    >

        <h2 id="modalTitle">
            Projeto
        </h2>

        <p>
            O que você deseja fazer?
        </p>


        <div class="buttons">

            <button
                class="primary"
                id="openButton"
            >
                🌐 Abrir
            </button>


            <button
                class="blue"
                id="editButton"
            >
                ✏️ Editar
            </button>


            <button
                id="bothButton"
            >
                🌐 + ✏️ Abrir + editar
            </button>

        </div>


        <button
            class="cancel"
            id="cancelButton"
        >
            Cancelar
        </button>

    </div>

</div>


<script>

const OWNER = "rico-maker";
const REPO = "rico-maker.github.io";

const GITHUB_API =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

const GITHUB_BASE =
    `https://${OWNER}.github.io/`;

const REPOSITORY =
    `https://github.com/${OWNER}/${REPO}`;


const projects = document.getElementById("projects");
const search = document.getElementById("search");

const modalOverlay =
    document.getElementById("modalOverlay");

const modalTitle =
    document.getElementById("modalTitle");

const openButton =
    document.getElementById("openButton");

const editButton =
    document.getElementById("editButton");

const bothButton =
    document.getElementById("bothButton");

const cancelButton =
    document.getElementById("cancelButton");


let allProjects = [];
let selectedProject = null;


/* --------------------------------
   CARREGAR PROJETOS
-------------------------------- */

async function loadProjects() {

    try {

        const response =
            await fetch(GITHUB_API);

        if (!response.ok) {
            throw new Error("Erro ao acessar o GitHub.");
        }

        const files =
            await response.json();


        allProjects = files

            .filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".html")
            )

            .filter(file =>
                file.name.toLowerCase() !== "index.html"
            )

            .map(file => {

                const name =
                    file.name.replace(/\.html$/i, "");

                return {
                    name,
                    file: file.name,
                    url: GITHUB_BASE + file.name,
                    edit:
                        `https://github.com/${OWNER}/${REPO}/edit/main/${encodeURIComponent(file.name)}`
                };

            });


        renderProjects(allProjects);

    }

    catch (error) {

        console.error(error);

        projects.innerHTML = "";

        const errorElement =
            document.createElement("div");

        errorElement.className = "loading";

        errorElement.textContent =
            "Não foi possível carregar os projetos.";

        projects.appendChild(errorElement);

        addCreateButton();

    }

}


/* --------------------------------
   RENDERIZAR PROJETOS
-------------------------------- */

function renderProjects(list) {

    projects.innerHTML = "";

    if (list.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "loading";

        empty.textContent =
            "Nenhum projeto encontrado.";

        projects.appendChild(empty);

    }

    else {

        list.forEach(project => {

            const card =
                document.createElement("button");

            card.className = "project";

            card.type = "button";

            card.innerHTML = `

                <span class="project-icon">
                    ◇
                </span>

                <span class="project-name">
                    ${escapeHTML(project.name)}
                </span>

                <span class="project-description">
                    Projeto HTML
                </span>

            `;

            card.addEventListener(
                "click",
                () => openModal(project)
            );

            projects.appendChild(card);

        });

    }


    /*
       O botão é SEMPRE adicionado
       depois de todos os projetos.
    */

    addCreateButton();

}


/* --------------------------------
   BOTÃO CRIAR
-------------------------------- */

function addCreateButton() {

    const button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "project create-project";

    button.innerHTML = `

        <span class="project-icon">
            ＋
        </span>

        <span class="project-name">
            Criar
        </span>

        <span class="project-description">
            Criar um novo projeto no GitHub
        </span>

    `;


    button.addEventListener(
        "click",
        () => {

            window.open(
                REPOSITORY,
                "_blank"
            );

        }
    );


    projects.appendChild(button);

}


/* --------------------------------
   PESQUISA
-------------------------------- */

search.addEventListener(
    "input",
    () => {

        const query =
            search.value
                .trim()
                .toLowerCase();


        const filtered =
            allProjects.filter(project =>
                project.name
                    .toLowerCase()
                    .includes(query)
            );


        renderProjects(filtered);

    }
);


/* --------------------------------
   MODAL
-------------------------------- */

function openModal(project) {

    selectedProject = project;

    modalTitle.textContent =
        project.name;

    modalOverlay.classList.add("active");

}


function closeModal() {

    modalOverlay.classList.remove("active");

    selectedProject = null;

}


/* ABRIR */

openButton.addEventListener(
    "click",
    () => {

        if (!selectedProject) return;

        window.open(
            selectedProject.url,
            "_blank"
        );

        closeModal();

    }
);


/* EDITAR */

editButton.addEventListener(
    "click",
    () => {

        if (!selectedProject) return;

        window.open(
            selectedProject.edit,
            "_blank"
        );

        closeModal();

    }
);


/* ABRIR + EDITAR */

bothButton.addEventListener(
    "click",
    () => {

        if (!selectedProject) return;

        window.open(
            selectedProject.url,
            "_blank"
        );

        window.open(
            selectedProject.edit,
            "_blank"
        );

        closeModal();

    }
);


/* CANCELAR */

cancelButton.addEventListener(
    "click",
    closeModal
);


/* CLICAR FORA DO MODAL */

modalOverlay.addEventListener(
    "click",
    event => {

        if (event.target === modalOverlay) {
            closeModal();
        }

    }
);


/* ESC */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {
            closeModal();
        }

    }
);


/* --------------------------------
   SEGURANÇA
-------------------------------- */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* --------------------------------
   INICIAR
-------------------------------- */

loadProjects();

</script>

</body>
</html>
