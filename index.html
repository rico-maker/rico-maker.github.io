<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rico Maker — Projetos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0d1117;
    color: #f0f6fc;
}

header {
    text-align: center;
    padding: 70px 20px 45px;
    background: linear-gradient(180deg, #161b22, #0d1117);
}

header h1 {
    margin: 0;
    font-size: 42px;
}

header p {
    color: #8b949e;
    margin-top: 12px;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

.search {
    width: 100%;
    padding: 15px 18px;
    margin: 25px 0 30px;

    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;

    color: white;
    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: #58a6ff;
}

#projects {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(260px, 1fr)
    );

    gap: 20px;
    padding-bottom: 60px;
}

.card {
    display: block;
    padding: 25px;

    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;

    text-decoration: none;
    color: white;

    cursor: pointer;

    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #58a6ff;
    box-shadow: 0 10px 30px #0006;
}

.icon {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #1f6feb22;
    color: #58a6ff;

    border-radius: 10px;

    font-size: 20px;
    margin-bottom: 18px;
}

.card h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.card p {
    margin: 0;
    color: #8b949e;
    font-size: 14px;
}


/* =========================
   POPUP
========================= */

.modal-background {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0, 0, 0, .72);

    backdrop-filter: blur(5px);

    z-index: 1000;
}

.modal-background.active {
    display: flex;
}

.modal {
    width: min(430px, 100%);

    background: #161b22;

    border: 1px solid #30363d;
    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);

    animation: popup .18s ease-out;
}

@keyframes popup {

    from {
        opacity: 0;
        transform: scale(.94) translateY(10px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

}

.modal h2 {
    margin: 0 0 10px;
}

.modal p {
    color: #8b949e;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.buttons button {
    width: 100%;

    padding: 14px;

    border-radius: 9px;

    border: 1px solid #30363d;

    background: #21262d;

    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: .15s;
}

.buttons button:hover {
    background: #30363d;
}

.buttons .primary {
    background: #238636;
    border-color: #238636;
}

.buttons .primary:hover {
    background: #2ea043;
}

.buttons .blue {
    background: #1f6feb;
    border-color: #1f6feb;
}

.buttons .blue:hover {
    background: #388bfd;
}

.cancel {
    margin-top: 15px;

    width: 100%;

    padding: 11px;

    background: transparent;

    border: none;

    color: #8b949e;

    cursor: pointer;
}

.cancel:hover {
    color: white;
}

.loading {
    text-align: center;
    color: #8b949e;
    padding: 50px;
}

footer {
    text-align: center;
    color: #8b949e;
    padding: 25px;
    border-top: 1px solid #21262d;
}

@media (max-width: 600px) {

    header {
        padding-top: 45px;
    }

}
</style>
</head>

<body>


<header>

    <h1>Rico Maker</h1>

    <p>
        Projetos e experimentos
    </p>

</header>


<main class="container">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Pesquisar projeto..."
        autocomplete="off"
    >

    <section id="projects">

        <div class="loading">
            Carregando projetos...
        </div>

    </section>

</main>


<footer>
    Rico Maker
</footer>



<!-- =========================
     POPUP
========================= -->

<div
    id="modalBackground"
    class="modal-background"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
    >

        <h2 id="modalTitle">
            Projeto
        </h2>

        <p>
            O que você deseja fazer?
        </p>


        <div class="buttons">

            <button
                class="primary"
                id="openButton"
            >
                🌐 Abrir
            </button>


            <button
                class="blue"
                id="editButton"
            >
                ✏️ Editar
            </button>


            <button
                id="bothButton"
            >
                🌐 + ✏️ Abrir + editar
            </button>

        </div>


        <button
            class="cancel"
            id="cancelButton"
        >
            Cancelar
        </button>

    </div>

</div>



<script>


/* =========================
   CONFIGURAÇÃO
========================= */

const USER = "rico-maker";

const REPO = "rico-maker.github.io";

const BRANCH = "main";


/* =========================
   ELEMENTOS
========================= */

const container =
    document.getElementById("projects");

const search =
    document.getElementById("search");

const modalBackground =
    document.getElementById("modalBackground");

const modalTitle =
    document.getElementById("modalTitle");

const openButton =
    document.getElementById("openButton");

const editButton =
    document.getElementById("editButton");

const bothButton =
    document.getElementById("bothButton");

const cancelButton =
    document.getElementById("cancelButton");


let pages = [];

let selectedPage = null;


/* =========================
   GITHUB API
========================= */

async function getPages() {

    const url =
        `https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Não foi possível acessar o GitHub."
        );

    }

    const data =
        await response.json();

    return data.tree.filter(file =>

        file.type === "blob" &&

        file.path
            .toLowerCase()
            .endsWith(".html") &&

        file.path
            .toLowerCase() !== "index.html"

    );
}


/* =========================
   NOME DO PROJETO
========================= */

function formatName(path) {

    let name =
        path
            .split("/")
            .pop()
            .replace(/\.html$/i, "");

    name =
        name.replace(/[-_]/g, " ");

    return name
        .split(" ")
        .map(word =>
            word.charAt(0).toUpperCase() +
            word.slice(1)
        )
        .join(" ");
}


/* =========================
   URL PUBLICADA
========================= */

function getPublicURL(page) {

    return (
        "https://" +
        USER +
        ".github.io/" +
        page.path
    );

}


/* =========================
   URL DO EDITOR DO GITHUB
========================= */

function getEditURL(page) {

    return (
        "https://github.com/" +
        USER +
        "/" +
        REPO +
        "/edit/" +
        BRANCH +
        "/" +
        page.path
    );

}


/* =========================
   ABRIR POPUP
========================= */

function openModal(page) {

    selectedPage = page;

    modalTitle.textContent =
        formatName(page.path);

    modalBackground.classList.add(
        "active"
    );

}


/* =========================
   FECHAR POPUP
========================= */

function closeModal() {

    modalBackground.classList.remove(
        "active"
    );

    selectedPage = null;

}


/* =========================
   ABRIR PROJETO
========================= */

openButton.onclick = () => {

    if (!selectedPage)
        return;

    const url =
        getPublicURL(selectedPage);

    window.open(
        url,
        "_blank"
    );

    closeModal();

};


/* =========================
   EDITAR PROJETO
========================= */

editButton.onclick = () => {

    if (!selectedPage)
        return;

    const url =
        getEditURL(selectedPage);

    window.open(
        url,
        "_blank"
    );

    closeModal();

};


/* =========================
   ABRIR + EDITAR
========================= */

bothButton.onclick = () => {

    if (!selectedPage)
        return;

    const publicURL =
        getPublicURL(selectedPage);

    const editURL =
        getEditURL(selectedPage);


    /*
        As duas chamadas acontecem
        diretamente no clique do usuário,
        reduzindo a chance de o navegador
        bloquear uma das abas.
    */

    window.open(
        publicURL,
        "_blank"
    );

    window.open(
        editURL,
        "_blank"
    );

    closeModal();

};


/* =========================
   CANCELAR
========================= */

cancelButton.onclick =
    closeModal;


/* =========================
   CLICAR FORA DO POPUP
========================= */

modalBackground.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modalBackground
        ) {

            closeModal();

        }

    }
);


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/* =========================
   CRIAR CARTÃO
========================= */

function createCard(page) {

    const card =
        document.createElement("div");

    card.className = "card";

    card.innerHTML = `

        <div class="icon">
            &lt;/&gt;
        </div>

        <h2>
            ${formatName(page.path)}
        </h2>

        <p>
            ${page.path}
        </p>

    `;


    card.addEventListener(
        "click",
        () => {

            openModal(page);

        }
    );


    return card;
}


/* =========================
   MOSTRAR PROJETOS
========================= */

function render(list) {

    container.innerHTML = "";


    if (list.length === 0) {

        container.innerHTML = `

            <div class="loading">
                Nenhum projeto encontrado.
            </div>

        `;

        return;

    }


    list.forEach(page => {

        container.appendChild(
            createCard(page)
        );

    });

}


/* =========================
   PESQUISA
========================= */

search.addEventListener(
    "input",
    () => {

        const query =
            search.value
                .toLowerCase()
                .trim();


        const filtered =
            pages.filter(page =>

                page.path
                    .toLowerCase()
                    .includes(query)

            );


        render(filtered);

    }
);


/* =========================
   INICIALIZAÇÃO
========================= */

async function init() {

    try {

        pages =
            await getPages();

        render(pages);

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="loading">

                Não foi possível carregar
                os projetos.

            </div>

        `;

    }

}


init();

</script>

</body>
</html>
