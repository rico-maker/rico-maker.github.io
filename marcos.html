<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, #171717 0%, #080808 55%, #000 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        .botao {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 360px;
            height: 120px;

            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 22px;

            background: linear-gradient(145deg, #1d1d1d, #0b0b0b);

            color: white;
            text-decoration: none;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 1px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.65),
                inset 0 1px 1px rgba(255,255,255,0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .botao:hover {
            transform: translateY(-6px);

            border-color: rgba(255,255,255,0.4);

            box-shadow:
                0 35px 80px rgba(0,0,0,0.8),
                0 0 35px rgba(255,255,255,0.08),
                inset 0 1px 2px rgba(255,255,255,0.12);
        }

        .botao:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <a href="marcosai/index.html" class="botao">
        Acesso aqui
    </a>

</body>
</html>
