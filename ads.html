<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rico Maker Plus</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: white;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: min(900px, 94vw);
        text-align: center;
    }

    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .skip {
        position: absolute;
        right: 18px;
        bottom: 18px;

        padding: 12px 20px;

        background: rgba(20, 20, 20, 0.9);
        color: white;

        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 8px;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        opacity: 0;
        pointer-events: none;

        transition: 0.25s;
    }

    .skip.visible {
        opacity: 1;
        pointer-events: auto;
    }

    .skip:hover {
        background: white;
        color: black;
    }

    .message {
        margin-top: 25px;
        font-size: 20px;
        font-weight: 500;
        color: #eeeeee;
    }

    .subscribe {
        margin-top: 16px;

        padding: 14px 30px;

        background: linear-gradient(
            135deg,
            #8c6500,
            #d4af37,
            #f3d76a,
            #b8860b
        );

        color: #171000;

        border: none;
        border-radius: 9px;

        font-size: 17px;
        font-weight: 800;

        cursor: pointer;

        box-shadow:
            0 0 18px rgba(212,175,55,0.25),
            inset 0 1px rgba(255,255,255,0.4);

        transition: transform 0.2s, box-shadow 0.2s;
    }

    .subscribe:hover {
        transform: translateY(-2px);

        box-shadow:
            0 0 30px rgba(212,175,55,0.45),
            inset 0 1px rgba(255,255,255,0.5);
    }

    .countdown {
        position: absolute;
        left: 18px;
        bottom: 18px;

        padding: 9px 13px;

        background: rgba(0,0,0,0.75);
        border-radius: 7px;

        font-size: 14px;
        color: #ddd;
    }

    .countdown.hidden {
        display: none;
    }
</style>
</head>

<body>

<div class="container">

    <div class="video-wrapper">

        <iframe
            id="youtube"
            src="https://www.youtube.com/embed/iCV_qxUqyOE?enablejsapi=1&autoplay=1&controls=1"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

        <div class="countdown" id="countdown">
            Você poderá pular em 5s
        </div>

        <button class="skip" id="skip">
            Pular anúncio
        </button>

    </div>

    <div class="message">
        Assine o plano Rico Maker Plus para remover os anúncios
    </div>

    <button class="subscribe" onclick="window.location.href='page.html'">
        Apenas R$34,99/mês
    </button>

</div>

<script>
    const skipButton = document.getElementById("skip");
    const countdownElement = document.getElementById("countdown");

    let seconds = 5;

    const timer = setInterval(() => {

        seconds--;

        if (seconds > 0) {
            countdownElement.textContent =
                `Você poderá pular em ${seconds}s`;
        } else {

            clearInterval(timer);

            countdownElement.classList.add("hidden");
            skipButton.classList.add("visible");
        }

    }, 1000);


    // Botão "Pular anúncio"
    skipButton.addEventListener("click", () => {
        window.location.href = "ai-car.html";
    });


    // API do YouTube
    let player;

    function onYouTubeIframeAPIReady() {

        player = new YT.Player("youtube", {

            events: {
                "onStateChange": onPlayerStateChange
            }

        });

    }


    function onPlayerStateChange(event) {

        // 0 = vídeo terminou
        if (event.data === YT.PlayerState.ENDED) {
            window.location.href = "ai-car.html";
        }

    }
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
